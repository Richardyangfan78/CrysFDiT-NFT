[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crysfdit-nft"
version = "1.0.0"
description = "CrysFDiT-NFT: latent flow-matching diffusion transformer for inorganic crystals, post-trained with Flow-DPO and DiffusionNFT"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy"]

[project.optional-dependencies]
cif = ["pymatgen"]

[tool.setuptools]
packages = ["crysfdit_nft", "crysfdit_nft.model", "crysfdit_nft.data"]
